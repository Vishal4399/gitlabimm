# ---------------------------------------------------------------------------
# Deployment folder immutability validation.
#
# Rule: any file under DEPLOY_DIR that exists on the target branch must be
# byte-identical in this branch. Only ADDING new files is permitted.
#
# v2 — closes two bypasses found by adversarial review of v1. See FIX A and
# FIX B. Fails CLOSED: anything it cannot determine aborts the job.
# ---------------------------------------------------------------------------

validate_deployment_tags:
  stage: validate

  variables:
    # Required. A shallow clone cannot see the history this job reads.
    GIT_DEPTH: 0
    DEPLOY_DIR: "oncloud/deployment"
    # Extra files that could switch this check off, space separated. The
    # project's CI config path is added automatically below — list here any
    # file pulled in via `include:`, e.g. "ci/validate.yml ci/deploy.yml".
    GUARD_FILES: ""

  rules:
    # Primary control — merge requests.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Defence in depth — pushes to the default branch. Restricted to `push`
    # so scheduled, web and API pipelines do not enter an arm that has no
    # previous commit to compare against.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

  script:
    - |
      set -euo pipefail

      TAB="$(printf '\t')"
      WORK="$(mktemp -d)"
      trap 'rm -rf "$WORK"' EXIT

      fail() { echo; echo "FATAL: $*" >&2; exit 1; }

      DEPLOY_DIR="${DEPLOY_DIR:-oncloud/deployment}"
      # CI_CONFIG_PATH is set whenever the project uses a non-default config
      # file. Guarding a hardcoded ".gitlab-ci.yml" silently protects nothing
      # in that case.
      GUARD_FILES="${GUARD_FILES:-} ${CI_CONFIG_PATH:-.gitlab-ci.yml}"

      echo "=================================================="
      echo "Checking deployment folder immutability"
      echo "=================================================="

      HEAD_SHA="$(git rev-parse HEAD)"
      MODE=""
      BASELINE=""
      BASELINE_NAME=""

      #
      # Merge request
      #
      if [ "${CI_PIPELINE_SOURCE:-}" = "merge_request_event" ]; then
        MODE="mr"
        TARGET="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-}"
        [ -n "${TARGET}" ] \
          || fail "CI_MERGE_REQUEST_TARGET_BRANCH_NAME is empty on a merge_request_event pipeline."

        echo "Pipeline Type : Merge Request"
        echo "Target Branch : ${TARGET}"

        # FIX A — never write "git fetch origin ${TARGET}".
        #
        # Git resolves a partial ref name as refs/tags/<name> BEFORE
        # refs/heads/<name>. Anyone able to push a tag can therefore create a
        # tag literally named "main", and FETCH_HEAD then points wherever that
        # tag points. Verified: the fetch prints
        #     * tag        main    -> FETCH_HEAD
        # instead of "* branch", the baseline moves to a commit that predates
        # the file, and a modification is reported as an addition. GitLab
        # protects no tags by default, so any Developer can do this and delete
        # the tag once the pipeline is green.
        #
        # Naming refs/heads explicitly removes the ambiguity. Writing to the
        # tracking ref in the same command also means we never read a stale
        # origin/<branch> — which was the v1 bug.
        git fetch --quiet --no-tags origin \
          "+refs/heads/${TARGET}:refs/remotes/origin/${TARGET}" \
          || fail "could not fetch refs/heads/${TARGET} from origin."

        BASELINE="$(git rev-parse "refs/remotes/origin/${TARGET}")"
        BASELINE_NAME="${TARGET}"

      #
      # Default branch push
      #
      elif [ "${CI_PIPELINE_SOURCE:-}" = "push" ] \
        && [ -n "${CI_COMMIT_BRANCH:-}" ] \
        && [ "${CI_COMMIT_BRANCH}" = "${CI_DEFAULT_BRANCH:-}" ]; then
        MODE="default"
        echo "Pipeline Type : Push to ${CI_COMMIT_BRANCH}"

        BEFORE="${CI_COMMIT_BEFORE_SHA:-}"
        [ -n "${BEFORE}" ] || fail "CI_COMMIT_BEFORE_SHA is not set on this push pipeline."

        if [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
          echo "No previous commit recorded for this push. Nothing to compare."
          exit 0
        fi
        git cat-file -e "${BEFORE}^{commit}" 2>/dev/null \
          || fail "previous commit ${BEFORE} is not in this clone. Confirm GIT_DEPTH: 0 is in effect."

        BASELINE="${BEFORE}"
        BASELINE_NAME="previous ${CI_COMMIT_BRANCH} tip"

      else
        fail "unexpected pipeline context (source=${CI_PIPELINE_SOURCE:-unset}, branch=${CI_COMMIT_BRANCH:-unset})."
      fi

      echo "Baseline      : ${BASELINE}"
      echo "Head          : ${HEAD_SHA}"
      echo ""

      #
      # Guard-file tampering — merge requests only.
      # On the default branch the merge has already happened, so refusing here
      # would only turn the branch red for something nobody can now split into
      # two merge requests.
      #
      if [ "${MODE}" = "mr" ]; then
        TOUCHED_DEPLOY="$(git diff --name-only "${BASELINE}" "${HEAD_SHA}" -- "${DEPLOY_DIR}")"
        TOUCHED_GUARD=""
        for GF in ${GUARD_FILES}; do
          [ -n "${GF}" ] || continue
          if [ -n "$(git diff --name-only "${BASELINE}" "${HEAD_SHA}" -- "${GF}")" ]; then
            TOUCHED_GUARD="${TOUCHED_GUARD} ${GF}"
          fi
        done
        if [ -n "${TOUCHED_GUARD}" ] && [ -n "${TOUCHED_DEPLOY}" ]; then
          echo "=================================================="
          echo "REFUSED: pipeline config and deployment files together"
          echo "=================================================="
          echo ""
          echo "Changed:${TOUCHED_GUARD}"
          echo "        files under ${DEPLOY_DIR}/"
          echo ""
          echo "Merge request pipelines run the config from the SOURCE branch,"
          echo "so a config change could disable this check in the same commit"
          echo "that edits a deployment tag. Split them into two merge requests."
          exit 1
        fi
      fi

      #
      # FIX B — compare against the target branch TIP, not a merge base.
      #
      # v1 asked "did this path exist at the merge base?". That is a different
      # question from "does this path exist on the target branch", and the two
      # diverge whenever more than one merge base exists. git merge-base prints
      # only ONE of them, and in a criss-cross history — which this workflow
      # produces naturally: a branch cut from main, another MR landing first,
      # then a merge commit — it can return the base that predates the tag
      # file. The mutation is then reported as an addition AND the merge
      # applies cleanly, so it reaches the target branch.
      #
      # Diffing against the tip removes merge bases from the verdict entirely.
      # The one case the tip alone cannot judge is D: a path on the target
      # branch that is absent here. That is legitimate when it landed on the
      # target after this branch was cut, and a violation when this branch
      # removed it. rev-list answers that exactly — if this branch's history
      # ever touched the path, this branch had it, so this branch removed it.
      #
      git diff --name-status --find-renames "${BASELINE}" "${HEAD_SHA}" \
        -- "${DEPLOY_DIR}" > "${WORK}/raw" || fail "git diff failed."

      : > "${WORK}/violations"
      : > "${WORK}/added"
      : > "${WORK}/incoming"

      while IFS="${TAB}" read -r ST P1 P2; do
        [ -n "${ST:-}" ] || continue
        case "${ST}" in
          A*) echo "  A  ${P1}" >> "${WORK}/added" ;;
          D*)
            if [ -n "$(git rev-list --max-count=1 "${HEAD_SHA}" -- "${P1}")" ]; then
              echo "  D  ${P1}  (deleted by this branch)" >> "${WORK}/violations"
            else
              echo "  .  ${P1}" >> "${WORK}/incoming"
            fi
            ;;
          M*) echo "  M  ${P1}  (contents changed)"        >> "${WORK}/violations" ;;
          R*) echo "  R  ${P1} -> ${P2}  (renamed)"        >> "${WORK}/violations" ;;
          C*) echo "  C  ${P1} -> ${P2}  (copied over)"    >> "${WORK}/violations" ;;
          T*) echo "  T  ${P1}  (file type changed)"       >> "${WORK}/violations" ;;
          *)  echo "  ${ST} ${P1}  (unrecognised status)"  >> "${WORK}/violations" ;;
        esac
      done < "${WORK}/raw"

      if [ -s "${WORK}/added" ]; then
        echo "New deployment files added by this change:"
        cat "${WORK}/added"
        echo ""
      fi
      if [ -s "${WORK}/incoming" ]; then
        echo "Present on ${BASELINE_NAME} but not here — landed after this branch"
        echo "was cut, the merge will bring them in. Not a violation:"
        cat "${WORK}/incoming"
        echo ""
      fi

      if [ -s "${WORK}/violations" ]; then
        echo "=================================================="
        echo "IMMUTABILITY VIOLATION DETECTED"
        echo "=================================================="
        echo ""
        echo "Deployment tags are immutable release artifacts. Files already on"
        echo "${BASELINE_NAME} must stay byte-identical."
        echo ""
        echo "Detected changes:"
        cat "${WORK}/violations"
        echo ""
        echo "Allowed:"
        echo "  A   Add deployment_tag_YYYYMMDD.txt"
        echo "      or deployment_tag_YYYYMMDD_<extended_name>.txt"
        echo ""
        echo "Not allowed:"
        echo "  M   Modify an existing deployment tag"
        echo "  D   Delete an existing deployment tag"
        echo "  R   Rename an existing deployment tag"
        echo "  T   Replace a deployment tag with a symlink"
        echo "  C   Copy over an existing deployment tag"
        echo ""
        echo "Resolution:"
        echo "  Create a new deployment_tag_YYYYMMDD.txt instead of changing an"
        echo "  existing one. If you see M on a file you thought you were adding,"
        echo "  someone else already merged that filename — pick a different"
        echo "  date or suffix."
        exit 1
      fi

      echo "Deployment folder immutability validation passed."

  interruptible: true
